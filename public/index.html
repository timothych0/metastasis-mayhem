<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metastasis Mayhem</title><link rel="stylesheet" href="style.css"></head><body><main class="landing"><h1>Metastasis Mayhem</h1><p class="lead">A two-player cooperative journey from adenoma to metastatic colonization.</p><section class="card"><h2>Classroom projector</h2><p>Create the shared game and display the room code.</p><a class="btn" href="host.html">Create host game</a></section><section class="card"><h2>Player device</h2><form id="join"><input id="code" inputmode="numeric" maxlength="4" placeholder="4-digit room code" required><input id="name" maxlength="20" placeholder="Your name" required><button class="btn">Join</button></form><p id="error"></p></section></main><script src="/socket.io/socket.io.js"></script><script>const s=io(),f=document.querySelector('#join');f.addEventListener('submit',e=>{e.preventDefault();s.emit('join-room',{code:code.value,name:name.value},r=>{if(r.ok)location.href=`controller.html?code=${r.code}&slot=${r.slot}&name=${encodeURIComponent(name.value)}`;else error.textContent=r.error})})</script></body></html>
