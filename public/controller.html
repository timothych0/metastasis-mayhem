<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Controller</title><link rel="stylesheet" href="style.css"></head><body><main class="controls"><div class="phase">PLAYER CONTROLLER</div><h1 id="who">Connecting…</h1><p id="status" class="muted"></p><section class="card"><h2 id="prompt">Wait for the host</h2><div id="answers" class="answers"></div><div id="pad" class="pad" hidden><button class="up" data-a="up">▲</button><button class="left" data-a="left">◀</button><button class="right" data-a="right">▶</button><button class="down" data-a="down">▼</button></div></section><p class="muted">During teaching, choose answers. During gameplay, your device becomes your tumor-cell controller.</p></main><script src="/socket.io/socket.io.js"></script><script>
const q=new URLSearchParams(location.search),code=q.get('code'),name=q.get('name')||'Player',s=io();let slot=q.get('slot');who.textContent=name;s.emit('join-room',{code,name},r=>{if(r.ok){slot=r.slot;status.textContent=`Player ${slot} · Room ${r.code}`}else status.textContent=r.error});
s.on('host-state',d=>{prompt.textContent=d.prompt||'Follow the projector';answers.innerHTML='';pad.hidden=d.phase!=='play';if(d.phase!=='play'){(d.options||[]).forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.addEventListener('click',()=>{answers.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.emit('answer',{code,value:i})});answers.appendChild(b)})}});document.querySelectorAll('#pad button').forEach(b=>{const send=v=>s.emit('control',{code,action:b.dataset.a,down:v});b.addEventListener('pointerdown',e=>{e.preventDefault();send(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();send(false)}))});s.on('ended',()=>{status.textContent='The host ended this room.';pad.hidden=true});
</script></body></html>
