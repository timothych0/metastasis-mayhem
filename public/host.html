<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metastasis Mayhem Host</title><link rel="stylesheet" href="style.css"></head><body><main><header class="top"><div><div class="phase">METASTASIS MAYHEM · TWO PLAYER</div><h1 id="title">Preparing game…</h1></div><div class="room">Room <span id="code">----</span></div></header><div class="players" id="players"></div><div class="progress" id="progress"></div><div class="layout"><section class="screen"><canvas id="game" width="800" height="500"></canvas></section><aside class="side"><div class="phase" id="phase">TEACH</div><h2 id="heading"></h2><p id="body"></p><div class="lesson" id="lesson"></div><div id="choices" class="choices" style="margin-top:12px"></div><p id="feedback" class="muted"></p><button id="advance" hidden>Continue</button></aside></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),cv=game,g=cv.getContext('2d');let room='',stage=0,phase='teach',answers={},keys={1:{},2:{}},last=performance.now();
const P=[{x:95,y:120,c:'#62a9ff'},{x:130,y:150,c:'#b08cf0'}];
const stages=[
 {t:'When does invasion begin?',teach:'Adenoma and high-grade dysplasia can be very abnormal without being invasive. In colorectal cancer, malignant glands become invasive when they cross the mucosal boundary into the submucosa.',q:'Which finding marks true invasive colorectal adenocarcinoma?',o:['More mitoses','High-grade dysplasia','Malignant glands invading into submucosa','A very large adenoma'],a:2,play:'Cross the epithelial barrier only after learning what invasion means.'},
 {t:'BREAK → GRAB → MOVE',teach:'Invadopodia concentrate invasive machinery. Matrix metalloproteinases remodel extracellular matrix. Integrins provide traction. Actin and myosin generate movement. Reduced E-cadherin weakens epithelial cell-to-cell adhesion.',q:'Which sequence best describes physical invasion?',o:['Integrins break → actin grabs → enzymes move','Invadopodia and matrix metalloproteinases break → integrins grab → actin/myosin move','E-cadherin breaks → platelets grab → lymph moves','Blood breaks → lymph grabs → tumor moves'],a:1,play:'Collect BREAK, then GRAB, then MOVE and penetrate the bowel wall.'},
 {t:'Pick your highway',teach:'The vessel-rich submucosa gives invasive cancer access to lymphatic and blood vessels. Lymphatic capillaries are comparatively permissive because of thin walls, loose endothelial junctions, low pressure, and less continuous basement-membrane support.',q:'Which route is generally more permissive for initial tumor-cell entry?',o:['Lymphatic capillary','Artery','They are structurally identical','Neither'],a:0,play:'Both cells must enter the same transport route.'},
 {t:'Now try not to die',teach:'Circulating tumor cells face anoikis, natural killer cell attack, and mechanical shear stress. Platelet interactions and tumor-cell clusters can improve survival.',q:'Which is NOT a new threat during circulation?',o:['Anoikis','Natural killer cell attack','Mechanical shear stress','Crossing the colonic epithelial basement membrane'],a:3,play:'Dodge anoikis, natural killer cells, and shear zones while crossing the vessel.'},
 {t:'Arrival ≠ metastasis',teach:'Delivery to another organ is not enough. A tumor cell must arrest, adhere to endothelium, cross the endothelial barrier, and enter distant tissue.',q:'A colorectal cancer cell reaches a liver capillary. What must happen next before tissue invasion?',o:['Nothing; arrival is metastasis','Endothelial adhesion and transendothelial migration','Return to the colon','Become dysplastic again'],a:1,play:'Collect endothelial adhesion and transendothelial migration, then leave the vessel.'},
 {t:'Seed and soil',teach:'Successful colonization requires a compatible microenvironment, survival signals, vascular support, and sustained proliferation. Most disseminated tumor cells fail to form a growing metastasis.',q:'Why can a disseminated tumor cell reach an organ but never form a metastasis?',o:['It may fail to adapt and proliferate there','All circulating cells automatically die','Only lymph nodes support cancer','Metastases cannot form vessels'],a:0,play:'Collect adaptation, vascular support, and sustained growth to establish the colony.'},
 {t:'Derek challenge',teach:'Derek’s pathway: familial adenomatous polyposis → many adenomas → high-grade dysplasia → invasive adenocarcinoma → lymphovascular invasion → regional lymph-node metastasis.',q:'What does Derek’s positive regional lymph node prove beyond lymphovascular invasion alone?',o:['Only that a vessel was entered','Successful regional metastatic colonization','A liver metastasis','Poor differentiation'],a:1,play:'Reconstruct Derek’s progression to finish the game.'}
];
function emit(){socket.emit('host-state',{code:room,stage,phase,prompt:phase==='teach'?'Watch the projector':phase==='practice'?stages[stage].q:'Use the directional controls',options:phase==='practice'?stages[stage].o:[]})}
function progressUI(){progress.innerHTML=stages.map((_,i)=>`<span class="dot ${i<stage?'done':i===stage?'on':''}"></span>`).join('')}
function setPhase(p){phase=p;answers={};phaseEl();renderSide();emit();setupPlay()}
function phaseEl(){document.getElementById('phase').textContent=phase.toUpperCase()}
function renderSide(){const s=stages[stage];title.textContent=`Level ${stage+1}: ${s.t}`;heading.textContent=s.t;choices.innerHTML='';advance.hidden=true;if(phase==='teach'){body.textContent=s.teach;lesson.innerHTML='<b>Goal:</b> understand this rule before touching the tumor cells.';advance.textContent='Start activity';advance.hidden=false}else if(phase==='practice'){body.textContent=s.q;lesson.innerHTML='<b>Both players answer on their own devices.</b> The playable challenge unlocks when both get it right.';s.o.forEach((o,i)=>{let d=document.createElement('div');d.className='choice';d.textContent=`${i+1}. ${o}`;choices.appendChild(d)});feedback.textContent='Waiting for both players…'}else{body.textContent=s.play;lesson.innerHTML='<b>Now use the mechanism.</b> Both tumor cells must survive.';feedback.textContent='Player devices are now movement controllers.'}progressUI()}
advance.addEventListener('click',()=>{if(phase==='teach')setPhase('practice');else if(phase==='complete'){if(stage<stages.length-1){stage++;setPhase('teach')}else finish()}});
socket.on('answer',d=>{if(phase!=='practice')return;answers[d.slot]=d.value;feedback.textContent=`Player ${d.slot} answered. ${Object.keys(answers).length}/2 responses received.`;if(answers[1]!==undefined&&answers[2]!==undefined){if(answers[1]===stages[stage].a&&answers[2]===stages[stage].a){feedback.textContent='Both correct — playable challenge unlocked.';setTimeout(()=>setPhase('play'),700)}else{feedback.textContent='Not yet. Discuss the mechanism and both players try again.';answers={}}}});
socket.on('control',d=>keys[d.slot][d.action]=d.down);socket.on('room-state',r=>players.innerHTML=[1,2].map(n=>{let p=r.players.find(x=>x.slot===n);return `<div class="player"><b style="color:${P[n-1].c}">Player ${n}</b> · ${p?p.name:'waiting…'}</div>`}).join(''));
function setupPlay(){P[0].x=95;P[0].y=120;P[1].x=130;P[1].y=150;window.collected=[]}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}function circ(x,y,r,c){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=c;g.fill()}function txt(t,x,y,z=10,c='#fff'){g.fillStyle=c;g.font=`700 ${z}px system-ui`;g.fillText(t,x,y)}
function colon(){rect(0,0,800,45,'#dcc7a7');txt('COLON LUMEN',15,28,11,'#5b4739');rect(0,45,800,160,'#d99588');for(let x=35;x<780;x+=72){g.fillStyle='#f1c9bb';g.beginPath();g.roundRect(x,62,38,125,16);g.fill();for(let y=76;y<180;y+=20)circ(x+8,y,2.5,'#60445f')}rect(0,205,800,6,'#835b78');txt('EPITHELIAL BASEMENT MEMBRANE',550,199,9,'#70445d');rect(0,211,800,85,'#e4b4a0');txt('LAMINA PROPRIA',15,235,10,'#65484a');rect(0,296,800,18,'#b95f65');txt('MUSCULARIS MUCOSAE',15,309,9);rect(0,314,800,138,'#e4c3a4');txt('SUBMUCOSA — LYMPHATIC AND BLOOD VESSELS',15,338,10,'#654b3c');g.strokeStyle='#70b89b';g.lineWidth=25;g.beginPath();g.moveTo(80,398);g.bezierCurveTo(250,355,355,430,475,390);g.stroke();txt('LYMPHATIC VESSEL',120,370,9,'#315e50');g.strokeStyle='#a94d57';g.lineWidth=30;g.beginPath();g.moveTo(525,405);g.bezierCurveTo(620,360,700,430,795,380);g.stroke();txt('BLOOD VESSEL',640,350,9,'#71343a');rect(0,452,800,48,'#a44c53');txt('MUSCULARIS PROPRIA',15,480,10)}
function drawPlay(){g.clearRect(0,0,800,500);if(stage<=2)colon();else if(stage===3){rect(0,0,800,500,'#743b45');rect(0,45,800,18,'#dda1a4');rect(0,437,800,18,'#dda1a4');txt('VESSEL LUMEN',15,28,11);[['ANOIKIS',245,125],['NATURAL KILLER CELL',430,300],['SHEAR STRESS',600,150]].forEach(h=>{circ(h[1],h[2],35,'#41242c');txt(h[0],h[1]-45,h[2]+4,8)})}else{rect(0,0,800,500,'#c78370');for(let y=45;y<470;y+=45)for(let x=30;x<790;x+=58){circ(x,y,17,'#d28b73');circ(x,y,3,'#70465b')}txt(stage===4?'DISTANT VESSEL AND TISSUE':'DISTANT ORGAN MICROENVIRONMENT',15,28,11)}
 if(stage===1){[['BREAK',245,245],['GRAB',430,315],['MOVE',610,385]].forEach(a=>{circ(a[1],a[2],22,'#efc766');txt(a[0],a[1]-25,a[2]-30,9,'#553f15')})}if(stage===4){[['ENDOTHELIAL ADHESION',300,125],['TRANSENDOTHELIAL MIGRATION',550,210]].forEach(a=>{circ(a[1],a[2],22,'#efc766');txt(a[0],a[1]-65,a[2]-30,8,'#553f15')})}if(stage===5){[['MICROENVIRONMENT ADAPTATION',240,140],['VASCULAR SUPPORT',430,330],['SUSTAINED GROWTH',650,165]].forEach(a=>{circ(a[1],a[2],22,'#efc766');txt(a[0],a[1]-70,a[2]-30,8,'#553f15')})}P.forEach((p,i)=>{circ(p.x,p.y,16,p.c);txt(`P${i+1}`,p.x-8,p.y+4,9,'#0c1425')})}
function update(dt){if(phase!=='play')return;P.forEach((p,i)=>{let k=keys[i+1],dx=(k.right?1:0)-(k.left?1:0),dy=(k.down?1:0)-(k.up?1:0),m=Math.hypot(dx,dy)||1;p.x=Math.max(16,Math.min(784,p.x+dx/m*150*dt));p.y=Math.max(16,Math.min(484,p.y+dy/m*150*dt))});let done=false;if(stage===0){done=P.every(p=>p.y>225)}else if(stage===1){[['BREAK',245,245],['GRAB',430,315],['MOVE',610,385]].forEach(a=>P.forEach(p=>{if(Math.hypot(p.x-a[1],p.y-a[2])<38&&!collected.includes(a[0]))collected.push(a[0])}));done=['BREAK','GRAB','MOVE'].every(x=>collected.includes(x))&&P.every(p=>p.y>405)}else if(stage===2){let lymph=P.every(p=>p.y>355&&p.x<500),blood=P.every(p=>p.y>355&&p.x>500);done=lymph||blood}else if(stage===3){done=P.every(p=>p.x>735)}else if(stage===4){[['ADHESION',300,125],['MIGRATION',550,210]].forEach(a=>P.forEach(p=>{if(Math.hypot(p.x-a[1],p.y-a[2])<42&&!collected.includes(a[0]))collected.push(a[0])}));done=collected.length>=2&&P.every(p=>p.y>300)}else if(stage===5){[['ADAPT',240,140],['VESSELS',430,330],['GROW',650,165]].forEach(a=>P.forEach(p=>{if(Math.hypot(p.x-a[1],p.y-a[2])<42&&!collected.includes(a[0]))collected.push(a[0])}));done=collected.length>=3&&P.every(p=>p.x>650)}else if(stage===6){done=P.every(p=>p.x>700)}if(done){phase='complete';phaseEl();feedback.textContent=stage===6?'Derek’s pathway reconstructed.':'Challenge cleared. Explain what your tumor cells just did before continuing.';advance.textContent=stage===stages.length-1?'Finish game':'Continue';advance.hidden=false;emit()}}
function finish(){title.textContent='Metastasis Mayhem complete';heading.textContent='Derek: put the whole story together';body.innerHTML='Familial adenomatous polyposis → multiple adenomas → high-grade dysplasia → <b>invasive adenocarcinoma</b> → lymphovascular invasion → <b>regional lymph-node metastasis</b>.';lesson.innerHTML='<b>T3:</b> through muscularis propria into pericolorectal tissue<br><b>N1a:</b> one regional lymph node<br><b>M0:</b> no clinically detected distant metastasis';choices.innerHTML='';feedback.textContent='Lymphovascular invasion proves access to a vascular route. The positive regional node proves successful regional metastatic colonization.';advance.hidden=true;phase='finished';phaseEl();emit()}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);if(phase==='play'||phase==='complete')drawPlay();else{g.clearRect(0,0,800,500);colon();g.fillStyle='rgba(13,19,32,.72)';g.fillRect(0,0,800,500);txt(phase==='teach'?'LEARN THE RULE':'SOLVE TO UNLOCK THE LEVEL',150,245,28);txt(stages[stage].t,230,285,16,'#efc766')}requestAnimationFrame(loop)}
socket.emit('create-room',{},r=>{room=r.code;code.textContent=room;renderSide();emit()});setupPlay();phaseEl();progressUI();requestAnimationFrame(loop);
</script></body></html>
